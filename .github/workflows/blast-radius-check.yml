name: Blast Radius Check

on:
  pull_request:
    branches: ["develop"]

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run check-blast-radius (headless mode)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Run the check-blast-radius skill against this PR's diff against develop" \
            --output-format json > blast-radius-result.json

      - name: Post result as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('blast-radius-result.json', 'utf8'));
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Blast Radius Check**\n\n${result.summary}`,
            });